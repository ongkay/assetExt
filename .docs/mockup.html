<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TVLink</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#009cff',
            primaryHover: '#0087e6',
            primaryTint: 'rgba(0, 156, 255, 0.1)',
            primarySoft: '#e8f6ff',
            primaryBorder: '#bde8ff',
            appBg: '#f3fbff',
            surfaceSoft: '#fbfdff',
            appBorder: '#d8e8f1',
            appBorderStrong: '#c8dcea',
            textStrong: '#18324a',
            textBase: '#2d4962',
            muted: '#6e8297',
            mutedStrong: '#5a6f85',
            success: '#059669',
            successBg: '#dcfce7',
            successBorder: 'rgba(5, 150, 105, 0.14)',
            danger: '#dc2626',
            dangerBg: '#fee2e2',
          },
          boxShadow: {
            app: '0 20px 44px rgba(22, 50, 74, 0.12)',
            soft: '0 12px 24px rgba(22, 50, 74, 0.08)',
            button: '0 10px 20px rgba(0, 156, 255, 0.26)',
            buttonHover: '0 14px 24px rgba(0, 156, 255, 0.32)',
            avatar: '0 10px 18px rgba(21, 45, 68, 0.16)',
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen p-4 font-sans text-textBase antialiased" style="background: radial-gradient(circle at top, #ecf6ff 0%, #dcecff 48%, #d5e5f7 100%);">
  <div class="mx-auto flex min-h-screen items-center justify-center">
    <main class="w-full max-w-[370px] overflow-hidden border border-white/90 shadow-app" style="background: radial-gradient(circle at top right, rgba(0, 156, 255, 0.14), transparent 36%), linear-gradient(180deg, #ffffff 0%, #f3fbff 100%);">
      <div class="flex min-h-[600px] flex-col p-4">
        <header class="mb-4 flex items-center justify-between gap-3 border-b border-appBorder pb-4">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-chart-line text-[26px] leading-none text-primary" aria-hidden="true"></i>

              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                  <span class="text-md font-extrabold leading-none tracking-wide text-textStrong">TvLink Extension</span>
                  <span class="inline-flex h-5 items-center rounded-full border border-primaryBorder bg-white/80 px-2 text-[10px] font-bold uppercase tracking-[0.16em] text-primaryHover">v2.0.0</span>
                </div>
                <p class="text-xs leading-5 text-mutedStrong">TradingView Premium Solution</p>
              </div>
            </div>
          </div>

          <div class="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-white/80 text-sm font-semibold text-sky-50 shadow-[0_8px_18px_rgba(21,45,68,0.14)]" style="background: linear-gradient(180deg, #203c58 0%, #152d44 100%);">
            A
          </div>
        </header>

        <section class="mb-4 rounded-lg border border-appBorder bg-white p-4 shadow-soft">
          <div class="mb-3 flex items-center justify-between border-b border-appBorder pb-3">
            <div class="text-xs font-semibold uppercase tracking-widest text-mutedStrong">Subscription</div>
            <div class="inline-flex items-center gap-2 rounded-full border border-successBorder bg-successBg px-2.5 py-1 text-xs font-bold text-success">
              <span class="h-2 w-2 rounded-full bg-success"></span>
              <span>Active</span>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <div class="mb-1 text-xs text-muted">Package</div>
              <div class="text-sm font-semibold text-textStrong truncate">Semi Private 30 days</div>
            </div>

            <div class="text-right">
              <div class="mb-1 text-xs text-muted">Expiry Date</div>
              <div class="text-sm font-semibold text-textStrong">02 Okt 2026</div>
            </div>
          </div>
        </section>

        <section class="grid gap-3">
          <article class="rounded-lg border border-appBorder bg-white p-4 shadow-soft">
            <div class="mb-3 flex items-center gap-3">
              <div class="grid h-11 w-11 place-items-center rounded-lg bg-primarySoft text-primary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M22 7 13.5 15.5l-5-5L2 17" />
                  <path d="M16 7h6v6" />
                </svg>
              </div>

              <div>
                <div class="mb-0.5 text-sm font-bold text-textStrong">TradingView</div>
                <div class="text-xs text-muted">Access TradingView Premium</div>
              </div>
            </div>

            <button type="button" class="inline-flex h-10 w-full items-center justify-center gap-2 rounded-md text-sm font-semibold text-white shadow-button transition duration-150 hover:-translate-y-0.5 hover:shadow-buttonHover" style="background: linear-gradient(135deg, #008cff 0%, #00b2ff 100%);">
              <span>Open Now</span>
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 3h6v6" />
                <path d="M10 14 21 3" />
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              </svg>
            </button>
          </article>

          <article class="rounded-lg border border-appBorder bg-white p-4 shadow-soft">
            <div class="mb-3 flex items-center gap-3">
              <div class="grid h-11 w-11 place-items-center rounded-lg bg-primarySoft text-primary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 3v18h18" />
                  <path d="M18 17V9" />
                  <path d="M13 17V5" />
                  <path d="M8 17v-3" />
                </svg>
              </div>

              <div>
                <div class="mb-0.5 text-sm font-bold text-textStrong">FXTester</div>
                <div class="text-xs text-muted">Access backtesting tools</div>
              </div>
            </div>

            <button type="button" class="inline-flex h-10 w-full items-center justify-center gap-2 rounded-md text-sm font-semibold text-white shadow-button transition duration-150 hover:-translate-y-0.5 hover:shadow-buttonHover" style="background: linear-gradient(135deg, #008cff 0%, #00b2ff 100%);">
              <span>Open Now</span>
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 3h6v6" />
                <path d="M10 14 21 3" />
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              </svg>
            </button>
          </article>
        </section>

        <footer class="mt-auto grid grid-cols-2 gap-2.5 border-t border-appBorder pt-4">
          <button type="button" class="group inline-flex h-10 items-center justify-center gap-2 rounded-md border border-appBorder bg-white text-sm font-semibold text-textStrong shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-primaryBorder hover:bg-primarySoft hover:text-primaryHover hover:shadow-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/25 focus-visible:ring-offset-2 focus-visible:ring-offset-white active:translate-y-0">
            <svg class="h-4 w-4 transition duration-200 group-hover:rotate-45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 2v6h-6" />
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
              <path d="M3 22v-6h6" />
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
            </svg>
            <span>Refresh</span>
          </button>

          <button type="button" class="group inline-flex h-10 items-center justify-center gap-2 rounded-md border border-red-200 bg-dangerBg text-sm font-semibold text-danger shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-red-300 hover:bg-red-50 hover:text-red-700 hover:shadow-soft focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-200 focus-visible:ring-offset-2 focus-visible:ring-offset-white active:translate-y-0">
            <svg class="h-4 w-4 transition duration-200 group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m16 17 5-5-5-5" />
              <path d="M21 12H9" />
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            </svg>
            <span>Logout</span>
          </button>
        </footer>
      </div>
    </main>
  </div>
</body>
</html>
